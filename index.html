<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kale Kıran · Futbol Tayfa</title><meta name="theme-color" content="#080f1c"><link rel="stylesheet" href="style.css?v=4"></head>
<body data-view="setup"><main class="studio">
<section class="panel" id="setupPage" aria-label="Maç hazırlığı">
<div class="brand">Futbol Tayfa</div><p class="eyebrow">MAÇ HAZIRLIĞI</p><h1>Takımları seç.<br><em>Sahaya geç.</em></h1><p class="intro">İki takım. Eşit şans. Tek kazanan.</p>
<label class="field">LİG / TURNUVA<select id="pool"><option value="all">Tüm takımlar</option></select></label>
<div class="teams"><label class="field"><span class="dot blue"></span> SOL TAKIM<select id="left"></select></label><button id="swap" aria-label="Takımları değiştir">⇄</button><label class="field"><span class="dot gold"></span> SAĞ TAKIM<select id="right"></select></label></div>
<button class="quiet" id="random">⤨ Rastgele eşleşme</button>
<div class="row"><label class="field">SÜRE SINIRI<select id="duration"><option value="short">1 dakika</option><option value="standard" selected>2 dakika</option><option value="long">3 dakika</option></select></label><label class="field">MAÇ TEMPOSU<select id="pace"><option value="1">Normal</option><option value="1.35">Hızlı</option><option value="0.8">Yavaş</option></select></label></div>
<label class="field">GÖRÜNTÜ KALİTESİ<select id="quality"><option value="2">HD · 1080 × 1920</option><option value="3" selected>Keskin · 1620 × 2880</option><option value="4">Ultra · 2160 × 3840</option></select></label>
<label class="toggle"><input id="sound" type="checkbox" checked> Oyun sesleri ve takım müziği</label>
<p id="notice" role="status"></p><button class="primary" id="start">MAÇI BAŞLAT ↗</button><button class="quiet" id="resumeMatch" hidden>Mevcut maça dön →</button>
<div class="rules"><b>NASIL KAZANILIR?</b><p>Rakip logolu blokları kır, kaleye ulaş. Süre biterse daha çok hasar veren kazanır. Eşitlikte ilk isabet kazanır.</p><p>Her maç sıfırdan başlar. Takımların güç farkı yoktur.</p></div></section>
<section class="preview" id="matchPage" aria-label="Maç sahası" hidden>
<div class="toolbar"><button id="back">← Takım seçimi</button><button id="record">Sadece saha ⛶</button></div>
<div class="frame"><canvas id="game" width="1620" height="2880" role="button" tabindex="0" aria-label="Maçı başlatmak veya duraklatmak için dokun"></canvas></div>
<nav class="mobileControls" aria-label="Oyun kontrolleri"><button id="touchPlay" class="touchPrimary">Başlat</button><button id="touchNew">Yeni maç</button><button id="snapshot">Görüntü al</button><button id="full">Tam ekran</button></nav>
</section></main><button id="exitRecord">← Kontroller</button>
<script src="ligler.js?v=4"></script><script src="teams.js?v=4"></script><script src="engine.js?v=4"></script><script src="render.js?v=4"></script><script src="app.js?v=4"></script><script src="mobile.js?v=4"></script></body></html>
